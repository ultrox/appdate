name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Validate (includes typecheck)
        run: bun run validate
      - name: Validate Vitest compatibility
        run: bun run test:vitest
      - run: bun run build
      - run: bunx @arethetypeswrong/cli --pack .
