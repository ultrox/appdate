name: Publish

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check package version
        id: version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          published_version="$(npm view @ma.vu/appdate version 2>/dev/null || true)"

          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

          if [[ "$package_version" == "$published_version" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version unchanged, skipping publish"
            exit 0
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"

            if [[ "$tag_version" != "$package_version" ]]; then
              echo "::error::Tag version $tag_version does not match package version $package_version"
              exit 1
            fi
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "publishing $package_version (registry has ${published_version:-no version})"
      - if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - if: steps.version.outputs.publish == 'true'
        run: bun run validate
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public
      - name: Create release tag
        if: steps.version.outputs.publish == 'true' && github.ref_type == 'branch'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          git tag "v${PACKAGE_VERSION}"
          git push origin "v${PACKAGE_VERSION}"
